<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Finance Planner</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: #fdf6f0;
    }
    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 30px;
      border-radius: 15px;
      background: #fef9f6;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      transition: all 0.5s ease;
    }
    h1 {
      text-align: center;
      color: #6a5acd;
      margin-bottom: 20px;
    }
    img.banner {
      display: block;
      margin: 0 auto 20px;
      max-width: 200px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    input, select, button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #6a5acd;
      box-shadow: 0 0 5px rgba(106,90,205,0.3);
    }
    button {
      background: #6a5acd;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #836fff;
    }
    .hidden { display: none; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #d8bfd8;
      color: #fff;
    }
    .summary {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      font-weight: bold;
      color: #6a5acd;
    }
  </style>
</head>
<body>

  <div class="container" id="loginContainer">
    <h1>Personal Finance Planner</h1>
    <img class="banner" src="https://raw.githubusercontent.com/devainiya/iniya/main/WhatsApp%20Image%202025-10-18%20at%2012.31.11_e9978759.jpg" alt="Finance Image">
    <form id="loginForm">
      <input type="text" id="name" placeholder="Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login / Register</button>
    </form>
  </div>

  <div class="container hidden" id="plannerContainer">
    <h1>Welcome, <span id="userName"></span>!</h1>
    <h2>Add Transaction</h2>
    <form id="transactionForm">
      <select id="type">
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>
      <input type="text" id="category" placeholder="Category" required>
      <input type="number" id="amount" placeholder="Amount" required>
      <input type="date" id="date" required>
      <input type="text" id="note" placeholder="Note">
      <button type="submit">Add Transaction</button>
    </form>

    <h2>Transactions</h2>
    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Category</th>
          <th>Amount</th>
          <th>Date</th>
          <th>Note</th>
        </tr>
      </thead>
      <tbody id="transactionTable"></tbody>
    </table>

    <div class="summary">
      <div>Total Income: ₹<span id="totalIncome">0</span></div>
      <div>Total Expense: ₹<span id="totalExpense">0</span></div>
      <div>Balance: ₹<span id="balance">0</span></div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const loginContainer = document.getElementById('loginContainer');
    const plannerContainer = document.getElementById('plannerContainer');
    const userNameSpan = document.getElementById('userName');

    let users = JSON.parse(localStorage.getItem('users')) || [];
    let currentUser = null;

    loginForm.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      let user = users.find(u => u.email === email);
      if(!user){
        user = { userId: Date.now(), name, email, password, createdAt: new Date().toISOString() };
        users.push(user);
        localStorage.setItem('users', JSON.stringify(users));
        alert('Registered successfully!');
      } else if(user.password !== password){
        alert('Incorrect password');
        return;
      } else {
        alert('Login successful');
      }

      currentUser = user;
      userNameSpan.textContent = currentUser.name;
      loginContainer.classList.add('hidden');
      plannerContainer.classList.remove('hidden');
      loadTransactions();
    });

    // Transactions
    const transactionForm = document.getElementById('transactionForm');
    const transactionTable = document.getElementById('transactionTable');

    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    function loadTransactions(){
      updateTransactionsTable();
    }

    transactionForm.addEventListener('submit', e => {
      e.preventDefault();
      const type = document.getElementById('type').value;
      const category = document.getElementById('category').value;
      const amount = document.getElementById('amount').value;
      const date = document.getElementById('date').value;
      const note = document.getElementById('note').value;

      const newTransaction = { transactionId: Date.now(), userId: currentUser.userId, type, category, amount, date, note };
      transactions.push(newTransaction);
      localStorage.setItem('transactions', JSON.stringify(transactions));
      transactionForm.reset();
      updateTransactionsTable();
    });

    function updateTransactionsTable(){
      transactionTable.innerHTML = '';
      let totalIncome = 0, totalExpense = 0;
      transactions.filter(t => t.userId === currentUser.userId).forEach(t => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${t.type}</td><td>${t.category}</td><td>₹${t.amount}</td><td>${t.date}</td><td>${t.note}</td>`;
        transactionTable.appendChild(row);
        if(t.type === 'income') totalIncome += Number(t.amount);
        else totalExpense += Number(t.amount);
      });
      document.getElementById('totalIncome').textContent = totalIncome;
      document.getElementById('totalExpense').textContent = totalExpense;
      document.getElementById('balance').textContent = totalIncome - totalExpense;
    }
  </script>
</body>
</html>
